packages:
  - apps/*
  - packages/*

# Metro (Expo) nao resolve os symlinks do store do pnpm de forma confiavel em
# monorepo. hoisted e' o workaround oficial da Expo.
nodeLinker: hoisted

allowBuilds:
  supabase: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - '@expo/ui@57.0.17'
  - babel-preset-expo@57.0.11
  - expo-glass-effect@57.0.2
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo-router@57.0.20
  - expo@57.0.21
